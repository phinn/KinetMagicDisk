name: KinetMagicDisk
options:
  bundleIdPrefix: com.kitnet
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  KinetMagicDisk:
    type: application
    platform: macOS
    sources:
      - path: KinetMagicDisk
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kitnet.magicdisk
        PRODUCT_NAME: KinetMagicDisk
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Support/KinetMagicDisk.entitlements
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: true
        SWIFT_EMIT_LOC_STRINGS: true

schemes:
  KinetMagicDisk:
    build:
      targets:
        KinetMagicDisk: all
    run:
      config: Debug
